[package]
name = "proxxyy"
version = "0.3.2"
edition = "2021"

[profile.release]
panic = "abort"
strip = true
debug = false
lto = "thin"

[dependencies]
clap = { version = "4", features = ["derive"] }
warp = { version = "0.4", features = ["server"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
env_logger = "0.11"
url = "2"
bytes = "1.4"
mime_guess = "2"
log = "0.4"
colored = "2.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
